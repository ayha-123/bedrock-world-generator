name: Generate Minecraft World

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract world template
        run: |
          rm -rf extracted world output
          mkdir -p extracted world output

          unzip -q template.zip -d extracted

          if [ -f extracted/level.dat ]; then
            cp -a extracted/. world/
          else
            WORLD_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -a "$WORLD_DIR"/. world/
          fi

          test -f world/level.dat
          test -d world/db

      - name: Test generator
        run: python main.py

      - name: Create MCWorld
        run: |
          cd world
          zip -qr ../output/MinecraftWorld.mcworld .

      - name: Upload MCWorld
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftWorld
          path: output/MinecraftWorld.mcworld
